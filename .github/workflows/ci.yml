name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  nixos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [cpx11]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: download ssh pub
        run: |
          cd dd-nixos-gen
          curl -fsSL https://github.com/tcurdt.keys > authorized_keys

      - name: build nixos
        run: |
          cd dd-nixos-gen
          nix build .#${{ matrix.server }} --print-build-logs

      - name: analyze image size
        run: |
          cd dd-nixos-gen

          ls -lh result/
          find result -type f -exec ls -lh {} \;

          sudo fdisk -l result/nixos.img

          LOOP_DEV=$(sudo losetup -f --show -P result/nixos.img)
          echo "Loop device: $LOOP_DEV"
          ls -l ${LOOP_DEV}*
          mkdir -p /tmp/mnt
          sudo mount -o ro ${LOOP_DEV}p1 /tmp/mnt || sudo mount -o ro ${LOOP_DEV}p2 /tmp/mnt

          echo ""
          echo "=== Disk usage breakdown ==="
          sudo du -h -d 1 /tmp/mnt | sort -h

          echo ""
          echo "=== Nix store size ==="
          sudo du -sh /tmp/mnt/nix/store 2>/dev/null || echo "No nix store found"

          echo ""
          echo "=== Top 20 largest files ==="
          sudo find /tmp/mnt -type f -exec du -h {} + | sort -rh | head -20

          echo ""
          echo "=== Why is Python included? ==="
          sudo nix-store --query --referrers /tmp/mnt/nix/store/*-python3-* 2>/dev/null | head -10 || echo "Cannot query referrers"

          sudo umount /tmp/mnt
          sudo losetup -d $LOOP_DEV

