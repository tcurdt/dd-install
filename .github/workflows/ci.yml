name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  nixos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [cpx11]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: download ssh pub
        run: |
          cd dd-nixos-gen
          curl -fsSL https://github.com/tcurdt.keys > authorized_keys

      - name: build nixos
        run: |
          cd dd-nixos-gen
          nix build .#${{ matrix.server }} --print-build-logs

      - name: analyze image size
        run: |
          cd dd-nixos-gen

          echo "=== Image file ==="
          ls -lh result/nixos.img

          echo ""
          echo "=== Partition table ==="
          sudo fdisk -l result/nixos.img

          echo ""
          echo "=== Mounting partition ==="
          sudo apt-get install -y kpartx
          LOOP_DEV=$(sudo losetup -f --show result/nixos.img)
          echo "Loop device: $LOOP_DEV"

          sudo kpartx -av $LOOP_DEV
          sleep 1

          PART=$(sudo kpartx -l $LOOP_DEV | head -1 | awk '{print $1}')
          echo "Partition: /dev/mapper/$PART"

          mkdir -p /tmp/mnt
          sudo mount -o ro /dev/mapper/$PART /tmp/mnt

          echo ""
          echo "=== Nix store size ==="
          sudo du -sh /tmp/mnt/nix/store 2>/dev/null || echo "No nix store found"

          sudo umount /tmp/mnt
          sudo kpartx -d $LOOP_DEV
          sudo losetup -d $LOOP_DEV

      - name: compress image
        run: |
          cd dd-nixos-gen
          mkdir -p output
          echo "=== Compressing image with zstd -19 ==="
          time zstd -19 result/nixos.img -o output/nixos-25.05-cpx11.img.zst
          echo ""
          echo "=== Final sizes ==="
          ls -lh result/nixos.img
          ls -lh output/nixos-25.05-cpx11.img.zst
          echo ""
          echo "Compression ratio: $(echo "scale=2; $(stat -c%s output/nixos-25.05-cpx11.img.zst) * 100 / $(stat -c%s result/nixos.img)" | bc)%"

