name: ci

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: set release metadata
        id: meta
        run: |
          echo "tag=build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Latest Build" \
            --notes "Built from ${{ github.sha }}" \
            --draft

  nixos:
    needs: [prepare_release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [25.11]
        server: [cpx]
        boot: [efi] # [bios, efi]
        arch: [amd]
        datafs: [zfs] # [ext4,xfs,zfs]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: download ssh pub
        run: |
          cd dd-nixos
          : > authorized_keys
          curl -fsSL https://github.com/tcurdt.keys >> authorized_keys
          git add authorized_keys

      - name: build nixos
        run: |
          cd dd-nixos
          sed -i 's|nixpkgs/nixos-25.11|nixpkgs/nixos-${{ matrix.version }}|g' flake.nix
          sed -i 's|boot = "bios"|boot = "${{ matrix.boot }}"|g' flake.nix
          sed -i 's|datafs = "xfs"|datafs = "${{ matrix.datafs }}"|g' flake.nix
          nix build .#${{ matrix.server }} --print-build-logs
          ls -lh result

      - name: upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dd-nixos
          asset="nixos-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.server }}-${{ matrix.datafs }}.img.zst"
          src="$(readlink -f result)"
          zstd -9 "$src" -o "$asset"
          gh release upload "${{ needs.prepare_release.outputs.tag }}" "$asset" --clobber

  debian:
    needs: [prepare_release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [trixie]
        server: [cpx]
        boot: [efi] # [bios, efi]
        arch: [amd]
        datafs: [zfs] # [ext4,xfs,zfs]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download ssh pub
        run: |
          cd dd-debian
          : > authorized_keys
          curl -fsSL https://github.com/tcurdt.keys >> authorized_keys

      - name: build debian
        run: |
          cd dd-debian
          VERSION=${{ matrix.version }} BOOT=${{ matrix.boot }} ARCH=${{ matrix.arch }} DATAFS=${{ matrix.datafs }} SSH_PUBKEY_FILE=authorized_keys ./docker.sh
          find result

      - name: upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dd-debian
          set -- result/*.img
          src="$1"
          asset="debian-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.server }}-${{ matrix.datafs }}.img.zst"
          zstd -9 "$src" -o "$asset"
          gh release upload "${{ needs.prepare_release.outputs.tag }}" "$asset" --clobber

  alpine:
    needs: [prepare_release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.21]
        server: [cpx]
        boot: [efi] # [bios, efi]
        arch: [x86_64]
        datafs: [zfs] # [ext4,xfs,zfs]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download ssh pub
        run: |
          cd dd-alpine
          : > authorized_keys
          curl -fsSL https://github.com/tcurdt.keys >> authorized_keys

      - name: build alpine
        run: |
          cd dd-alpine
          VERSION=${{ matrix.version }} BOOT=${{ matrix.boot }} ARCH=${{ matrix.arch }} DATAFS=${{ matrix.datafs }} SSH_PUBKEY_FILE=authorized_keys ./docker.sh
          find result

      - name: upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dd-alpine
          set -- result/*.img
          src="$1"
          asset="alpine-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.server }}-${{ matrix.datafs }}.img.zst"
          zstd -9 "$src" -o "$asset"
          gh release upload "${{ needs.prepare_release.outputs.tag }}" "$asset" --clobber

  finalize_release:
    if: ${{ always() }}
    needs: [prepare_release, nixos, debian, alpine]
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.finalize.outputs.published }}
    steps:
      - name: publish or delete draft release
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare_release.outputs.tag }}
          NIXOS_RESULT: ${{ needs.nixos.result }}
          DEBIAN_RESULT: ${{ needs.debian.result }}
          ALPINE_RESULT: ${{ needs.alpine.result }}
        run: |
          if [ "$NIXOS_RESULT" = "success" ] && [ "$DEBIAN_RESULT" = "success" ] && [ "$ALPINE_RESULT" = "success" ]; then
            gh release edit "$TAG" \
              --draft=false \
              --latest \
              --title "Latest Build" \
              --notes "Built from ${{ github.sha }}"
            echo "published=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Release Result"
              echo "- Tag: $TAG"
              echo "- Status: published"
              echo "- NixOS: $NIXOS_RESULT"
              echo "- Debian: $DEBIAN_RESULT"
              echo "- Alpine: $ALPINE_RESULT"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            gh release delete "$TAG" --yes --cleanup-tag || true
            echo "published=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Release Result"
              echo "- Tag: $TAG"
              echo "- Status: draft deleted"
              echo "- NixOS: $NIXOS_RESULT"
              echo "- Debian: $DEBIAN_RESULT"
              echo "- Alpine: $ALPINE_RESULT"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  cleanup_old_releases:
    needs: [prepare_release, finalize_release]
    if: ${{ needs.finalize_release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: delete older releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare_release.outputs.tag }}
        run: |
          gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | while read -r old_tag; do
            if [ "$old_tag" != "$TAG" ]; then
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done
