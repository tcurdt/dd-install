name: ci

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nixos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [25.11]
        server: [cpx]
        boot: [efi] # [bios, efi]
        arch: [amd]
        datafs: [zfs] # [ext4,xfs,zfs]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: download ssh pub
        run: |
          cd dd-nixos
          : > authorized_keys
          curl -fsSL https://github.com/tcurdt.keys >> authorized_keys
          git add authorized_keys

      - name: build nixos
        run: |
          cd dd-nixos
          sed -i 's|nixpkgs/nixos-25.11|nixpkgs/nixos-${{ matrix.version }}|g' flake.nix
          sed -i 's|boot = "bios"|boot = "${{ matrix.boot }}"|g' flake.nix
          sed -i 's|datafs = "xfs"|datafs = "${{ matrix.datafs }}"|g' flake.nix
          nix build .#${{ matrix.server }} --print-build-logs
          ls -lh result

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixos-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.server }}-${{ matrix.datafs }}.img
          path: dd-nixos/result
          compression-level: 2
          retention-days: 7

  debian:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [trixie]
        server: [cpx]
        boot: [efi] # [bios, efi]
        arch: [amd]
        datafs: [zfs] # [ext4,xfs,zfs]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download ssh pub
        run: |
          cd dd-debian
          : > authorized_keys
          curl -fsSL https://github.com/tcurdt.keys >> authorized_keys

      - name: build debian
        run: |
          cd dd-debian
          VERSION=${{ matrix.version }} BOOT=${{ matrix.boot }} ARCH=${{ matrix.arch }} DATAFS=${{ matrix.datafs }} SSH_PUBKEY_FILE=authorized_keys ./docker.sh
          find result

      - name: upload image
        uses: actions/upload-artifact@v7
        with:
          name: debian-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.server }}-${{ matrix.datafs }}.img
          path: dd-debian/result/*.img
          compression-level: 2
          retention-days: 7

  alpine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.21]
        server: [cpx]
        boot: [efi] # [bios, efi]
        arch: [x86_64]
        datafs: [zfs] # [ext4,xfs,zfs]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download ssh pub
        run: |
          cd dd-alpine
          : > authorized_keys
          curl -fsSL https://github.com/tcurdt.keys >> authorized_keys

      - name: build alpine
        run: |
          cd dd-alpine
          VERSION=${{ matrix.version }} BOOT=${{ matrix.boot }} ARCH=${{ matrix.arch }} DATAFS=${{ matrix.datafs }} SSH_PUBKEY_FILE=authorized_keys ./docker.sh
          find result

      - name: upload image
        uses: actions/upload-artifact@v7
        with:
          name: alpine-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.server }}-${{ matrix.datafs }}.img
          path: dd-alpine/result/*.img
          compression-level: 2
          retention-days: 7

  release:
    needs: [nixos, debian, alpine]
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: prepare release assets
        run: |
          mkdir -p release
          ls -lhR artifacts
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            find "$dir" -type f | while read -r file; do
              zstd -9 "$file" -o "release/${name}.zst"
            done
          done
          ls -lh release

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$(date -u +%Y%m%d-%H%M%S)"

          gh release create "$tag" release/* \
            --title "Latest Build" \
            --notes "Built from ${{ github.sha }}"

          # delete older releases, keep the one we just created
          gh release list --json tagName --jq '.[].tagName' | while read -r old_tag; do
            if [ "$old_tag" != "$tag" ]; then
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done

          echo "## Download URLs" >> "$GITHUB_STEP_SUMMARY"
          for file in release/*; do
            name=$(basename "$file")
            echo "- https://github.com/${{ github.repository }}/releases/latest/download/${name}" >> "$GITHUB_STEP_SUMMARY"
          done
