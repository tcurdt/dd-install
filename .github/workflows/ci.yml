name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  nixos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [25.11]
        boot: [bios]
        arch: [amd]
        server: [cpx11]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: download ssh pub
        run: |
          cd dd-nixos-gen
          curl -fsSL https://github.com/tcurdt.keys > authorized_keys
          git add authorized_keys

      - name: build nixos
        run: |
          cd dd-nixos-gen
          # replace nixos-25.11 with nixos-${{ matrix.version }}
          nix build .#${{ matrix.server }} --print-build-logs
          ls -lh result

      - name: upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: nixos-${{ matrix.version }}-${{ matrix.server }}.img
          path: dd-nixos-gen/result
          compression-level: 2
          retention-days: 7

      - name: print download link
        run: |
          echo "download via nightly"
          echo "https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/nixos-${{ matrix.version }}-${{ matrix.server }}.img.zip"

  debian:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [trixie]
        boot: [bios]
        arch: [amd]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download ssh pub
        run: |
          mkdir -p ~/.ssh
          curl -fsSL https://github.com/tcurdt.keys > authorized_keys
          git add authorized_keys

      - name: build debian
        run: |
          cd dd-debian
          VERSION=${{ matrix.version }} BOOT=${{ matrix.boot }} ARCH=${{ matrix.arch }} SSH_PUBKEY_FILE=authorized_keys ./docker.sh
          find result

      - name: upload image
        uses: actions/upload-artifact@v6
        with:
          name: debian-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.arch}}.img
          path: dd-debian/result/*.img
          compression-level: 2
          retention-days: 7

      - name: print download link
        run: |
          echo "download via nightly.link"
          echo "https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/debian-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.arch }}.img.zip"
