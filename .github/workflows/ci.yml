name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  nixos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [25.05]
        boot: [bios]
        arch: [amd]
        server: [cpx11]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: download ssh pub
        run: |
          cd dd-nixos-gen
          curl -fsSL https://github.com/tcurdt.keys > authorized_keys

      - name: build nixos
        run: |
          cd dd-nixos-gen
          nix build .#${{ matrix.server }} --print-build-logs

      - name: analyze image size
        run: |
          cd dd-nixos-gen

          echo "=== Image file ==="
          ls -lh result/nixos.img

          echo ""
          echo "=== Partition table ==="
          sudo fdisk -l result/nixos.img

          echo ""
          echo "=== Mounting partition ==="
          sudo apt-get install -y kpartx
          LOOP_DEV=$(sudo losetup -f --show result/nixos.img)
          echo "Loop device: $LOOP_DEV"

          sudo kpartx -av $LOOP_DEV
          sleep 1

          PART=$(sudo kpartx -l $LOOP_DEV | head -1 | awk '{print $1}')
          echo "Partition: /dev/mapper/$PART"

          mkdir -p /tmp/mnt
          sudo mount -o ro /dev/mapper/$PART /tmp/mnt

          echo ""
          echo "=== Nix store size ==="
          sudo du -sh /tmp/mnt/nix/store 2>/dev/null || echo "No nix store found"

          sudo du -sh /tmp/mnt/nix/store/* | sort -rh | head -30

          sudo umount /tmp/mnt
          sudo kpartx -d $LOOP_DEV
          sudo losetup -d $LOOP_DEV

      - name: compress image
        run: |
          cd dd-nixos-gen
          ls -lh result/*.img

          # mkdir -p output
          # time zstd -19 result/nixos.img \
          #   -o output/nixos-${{ matrix.version }}-${{ matrix.server }}.img.zst
          # ls -lh output/*.img.zst

      - name: upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: nixos-${{ matrix.version }}-${{ matrix.server }}.img
          path: dd-nixos-gen/result/*.img
          compression-level: 2
          retention-days: 7

  debian:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [trixie]
        boot: [bios]
        arch: [amd]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download ssh pub
        run: |
          mkdir -p ~/.ssh
          curl -fsSL https://github.com/tcurdt.keys > ~/.ssh/id_ed25519.pub

      - name: build debian
        run: |
          VERSION=${{ matrix.version }} BOOT=${{ matrix.boot }} ARCH=${{ matrix.arch }} ./dd-debian/docker.sh

      - name: compress image
        run: |
          cd dd-debian
          ls -lh result/*.img

          # mkdir -p output
          # time zstd -19 result/debian.img \
          #   -o output/debian-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.arch }}.img.zst
          # ls -lh output/*.img.zst

      - name: upload image
        uses: actions/upload-artifact@v6
        with:
          name: debian-${{ matrix.version }}-${{ matrix.boot }}-${{ matrix.arch}}.img
          path: dd-debian/result/*.img
          compression-level: 2
          retention-days: 7
