name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  nixos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [cpx11]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: download ssh pub
        run: |
          cd dd-nixos-gen
          curl -fsSL https://github.com/tcurdt.keys > authorized_keys

      - name: build nixos
        run: |
          cd dd-nixos-gen
          nix build .#${{ matrix.server }} --print-build-logs
          ls -la

